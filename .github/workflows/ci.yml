name: CI

# Roda a cada push, em qualquer branch (o resultado também aparece no PR).
on:
  push:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, intl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: npm run build
      - run: php artisan test --log-junit junit.xml
      - name: Mostrar testes que falharam
        if: failure()
        run: php tests/anotar-falhas.php junit.xml

  # Mesmos testes no PostgreSQL, o banco usado na publicação.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: laboratorio
          POSTGRES_PASSWORD: laboratorio
          POSTGRES_DB: laboratorio
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: laboratorio
      DB_USERNAME: laboratorio
      DB_PASSWORD: laboratorio
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring, intl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
